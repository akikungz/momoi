name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - development

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # Bonus: Cache Bun dependencies
      - name: Cache Bun dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.bun
            ./node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Generate prisma client
        run: bun db:gen

      - name: Run tests
        run: bun test --coverage

  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ github.ref_name }} .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  deploy:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Trigger rollout on kubernetes
        run: |
          kubectl rollout restart deployment/momoi-${{ github.ref_name }} -n fitm-cloud

      - name: Verify deployment status
        run: |
          kubectl rollout status deployment/momoi-${{ github.ref_name }} -n fitm-cloud --timeout=300s
